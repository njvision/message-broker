spring.application.name=messager-broker

server.port=${SERVER_PORT:8080}

# ---- broker connection ----
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=10s

# ---- publishing ----
# confirms + returns: the agent is told when a publish is refused or matches no
# queue, instead of losing the message silently (see PublishGuard)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=1s

# ---- consumer behaviour ----
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10s

# ---- messaging topology ----
messager.exchange=${MESSAGER_EXCHANGE:messager.exchange}
# Groups are NOT listed here: one is created when its first receiver registers,
# and every group gets its own durable queue messager.queue.<group>.
# Set this only to declare groups before any receiver shows up.
messager.groups=${MESSAGER_GROUPS:}
# routing key suffix that reaches every group at once
messager.broadcast-key=${MESSAGER_BROADCAST_KEY:all}
messager.audit-queue=${MESSAGER_AUDIT_QUEUE:messager.queue.audit}
# competing consumers inside one group
messager.concurrency-per-group=${MESSAGER_CONCURRENCY:2}
# messages kept per in-memory channel before the oldest is dropped
messager.history-limit=${MESSAGER_HISTORY_LIMIT:100}

# ---- delivery policy (broker -> receiver) ----
messager.delivery.max-attempts=${MESSAGER_DELIVERY_ATTEMPTS:3}
messager.delivery.backoff=${MESSAGER_DELIVERY_BACKOFF:500ms}
messager.delivery.timeout=${MESSAGER_DELIVERY_TIMEOUT:3s}
messager.delivery.confirm-timeout=${MESSAGER_CONFIRM_TIMEOUT:5s}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
