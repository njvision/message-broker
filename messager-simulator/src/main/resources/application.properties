spring.application.name=messager-simulator

server.port=${SERVER_PORT:9100}

# Where the message agent lives
simulator.broker-url=${BROKER_URL:http://localhost:8080}

# ---- receiver role ----
simulator.receiver.enabled=${RECEIVER_ENABLED:false}
# the address a sender writes as @name; empty means "use my host name"
simulator.receiver.name=${RECEIVER_NAME:}
# the group joined; the agent creates it if it is new
simulator.receiver.group=${RECEIVER_GROUP:default}
# empty: the receiver works out its own host:port and tells the agent
simulator.receiver.callback-url=${RECEIVER_CALLBACK_URL:}
simulator.receiver.history-limit=${RECEIVER_HISTORY_LIMIT:100}

# ---- sender role ----
simulator.sender.enabled=${SENDER_ENABLED:false}
simulator.sender.name=${SENDER_NAME:sender}
# only where the timer sends; every POST /send can name its own destination
simulator.sender.default-target=${SENDER_DEFAULT_TARGET:all}
simulator.sender.auto=${SENDER_AUTO:false}
simulator.sender.interval=${SENDER_INTERVAL:5s}

management.endpoints.web.exposure.include=health,info
